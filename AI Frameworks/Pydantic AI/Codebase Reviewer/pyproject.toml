[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deeprepo-reviewer"
version = "0.1.0"
description = "Autonomous AI Codebase Review Agent built with Pydantic Deep and Multi-Agent Orchestration"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "DeepRepo Team", email = "dev@deeprepo.local" },
]
keywords = ["pydantic", "pydantic-ai", "pydantic-deep", "code-review", "ai-agents", "security", "git"]
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pydantic-ai>=0.0.24",
    "pydantic-deep>=0.3.40",
    "rich>=13.9.0",
    "typer>=0.15.0",
    "gitpython>=3.1.43",
    "httpx>=0.28.0",
    "google-genai>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[project.scripts]
deeprepo = "app.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
