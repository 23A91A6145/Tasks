[project]
name = "agenteval-lab"
version = "0.1.0"
description = "AgentEval Lab - Production-Grade Pydantic AI Evaluation & Observability Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-ai>=0.0.14",
    "logfire>=0.50.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]


[tool.ruff]
line-length = 100
target-version = "py310"
