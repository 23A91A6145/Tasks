version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./history:/workspace/history
      - ./logs:/workspace/logs
    restart: unless-stopped
