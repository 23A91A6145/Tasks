[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[project]
name = "startup-validator-ai"
version = "1.0.0"
description = "Evidence-Driven Multi-Agent Startup Validation Platform"
authors = [{ name = "Startup Validator Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "sse-starlette>=2.1.0"
]
