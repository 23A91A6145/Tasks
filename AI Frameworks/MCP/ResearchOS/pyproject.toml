[project]
name = "research-os"
version = "0.1.0"
description = "ResearchOS - Production Agentic AI Research Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "numpy>=1.26.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0"
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
