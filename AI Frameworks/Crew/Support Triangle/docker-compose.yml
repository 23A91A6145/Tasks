version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_MODEL=${LLM_MODEL:-llama3.2:3b}
      - MAX_QUERY_LENGTH=2000
      - MAX_REVISIONS=1
    command: uvicorn api.fastapi_app:app --host 0.0.0.0 --port 8000

  ui:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_MODEL=${LLM_MODEL:-llama3.2:3b}
    command: streamlit run ui/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - api
